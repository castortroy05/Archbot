[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "archbot"
version = "0.1.0"
description = "An LLM assistant for Arch Linux install interactions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Archbot contributors" }]
dependencies = []

[project.scripts]
archbot = "archbot.cli:main"

